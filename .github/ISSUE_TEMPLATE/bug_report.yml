name: Bug report
description: The card shows something wrong, or does not load.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        The card is in development (0.x), so its options may still change between versions.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Card YAML
      description: The card's configuration from the dashboard editor.
      render: yaml
    validations:
      required: true
  - type: input
    id: card-version
    attributes:
      label: Card version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: ha-version
    attributes:
      label: Home Assistant version
      placeholder: "2026.11.1"
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser or app
      placeholder: "Chrome 141 on Windows, Home Assistant app on iOS"
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot and browser console errors
      description: A screenshot of the card, and anything red in the browser console (F12).
