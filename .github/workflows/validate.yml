name: "Validate"

# HACS only accepts a card repo that has a release (or a built file committed to dist/,
# which this repo does not do), so validation runs on every published release and by hand.
# Add a weekly schedule once 0.1.0 is out.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hacs: # https://github.com/hacs/action
    name: "HACS validation"
    runs-on: ubuntu-24.04
    steps:
      - uses: hacs/action@22.5.0
        with:
          category: plugin
