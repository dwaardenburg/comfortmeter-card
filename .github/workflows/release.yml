name: "Release"

# Releases are started by hand after the change is verified on a real Home Assistant.
# Nothing is tagged or published on a push.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without a leading v (must match package.json)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    name: "Build and publish"
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: "Check the version"
        env:
          VERSION: ${{ inputs.version }}
        run: |
          actual=$(node -p "require('./package.json').version")
          if [ "$actual" != "$VERSION" ]; then
            echo "::error::package.json says $actual, the release asked for $VERSION"
            exit 1
          fi
          if ! grep -q "^## $VERSION\b" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## $VERSION' section"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::v$VERSION is already tagged"
            exit 1
          fi

      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm test
      - run: pnpm run build

      - name: "Extract release notes"
        env:
          VERSION: ${{ inputs.version }}
        run: |
          awk -v heading="## $VERSION" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"

      - name: "Publish the GitHub Release"
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "v$VERSION" dist/comfortmeter-card.js \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md"
